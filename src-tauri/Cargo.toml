[package]
name = "stick-tv-player"
description = "Desktop TV player for ITE IT9175 ISDB-T USB sticks (PT275 / PT275C)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "stick_tv_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stick-tuner = { path = "../crates/tuner" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
