# Builds the Windows installer and a portable zip (release mode, mpv bundled).
#  - Push a tag like v0.2.0: publishes a GitHub release with both attached.
#    The tag must match "version" in src-tauri/tauri.conf.json (the installer is named after that).
#  - Run it by hand (Actions -> Release -> Run workflow): builds only, both are workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # rustup installs the toolchain pinned in rust-toolchain.toml on first use
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Driver tests
        run: cargo test -p stick-tuner

      - name: Fetch mpv
        shell: pwsh
        run: ./tools/fetch-mpv.ps1

      - name: Build and (on tags) create the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config src-tauri/tauri.mpv.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Stick TV Player ${{ github.ref_name }}
          releaseBody: |
            Windows x64, mpv included.

            - `Stick TV Player_<version>_x64-setup.exe`: installer (current user, no admin rights).
            - `stick-tv-player_<version>_x64-portable.zip`: no install. Unzip anywhere and run `stick-tv-player.exe`.
              Needs WebView2, which comes with Windows 10/11. Settings are still kept in `%APPDATA%`.

            Before the first use, bind the WinUSB driver to the stick with Zadig: see the README.
          releaseDraft: false

      - name: Portable zip
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $dir = "target/portable/stick-tv-player"
          New-Item -ItemType Directory -Force "$dir/mpv" | Out-Null
          Copy-Item target/release/stick-tv-player.exe $dir
          Copy-Item src-tauri/binaries/mpv/mpv.exe "$dir/mpv"
          $zip = "target/portable/stick-tv-player_${v}_x64-portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -Force
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Attach the portable zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.ZIP }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            ${{ env.ZIP }}
