# Builds the Windows installer (release mode, mpv bundled).
#  - Push a tag like v0.2.0: creates a draft GitHub release with the installer attached. Check it, then publish it.
#    The tag must match "version" in src-tauri/tauri.conf.json (the installer is named after that).
#  - Run it by hand (Actions -> Release -> Run workflow): builds only, the installer is a workflow artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # rustup installs the toolchain pinned in rust-toolchain.toml on first use
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Driver tests
        run: cargo test -p stick-tuner

      - name: Fetch mpv
        shell: pwsh
        run: ./tools/fetch-mpv.ps1

      - name: Build and (on tags) create the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config src-tauri/tauri.mpv.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Stick TV Player ${{ github.ref_name }}
          releaseBody: |
            Windows installer (x64). mpv is included.

            Before the first use, bind the WinUSB driver to the stick with Zadig: see the README.
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/release/bundle/nsis/*.exe
